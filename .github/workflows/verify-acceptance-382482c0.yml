name: verify-corrective-acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild corrective acceptance and integrated landing pages
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 acceptance-382482c0/build.py
          PYTHONDONTWRITEBYTECODE=1 python3 verification-3347ca0a/build.py
      - name: Verify acceptance, citations, links and complete cost ladder
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 acceptance-382482c0/verify.py
          PYTHONDONTWRITEBYTECODE=1 python3 verification-3347ca0a/verify.py
      - name: Check generated output is committed
        run: git diff --exit-code -- acceptance-382482c0 verification-3347ca0a index.html
