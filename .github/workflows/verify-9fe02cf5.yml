name: verify-9fe02cf5
on:
  push:
    branches: [main, arena/9fe02cf5-china2]
    paths: ['verify-9fe02cf5/**', 'ladder/build.py', 'index.html', '.github/workflows/verify-9fe02cf5.yml']
  pull_request:
    branches: [main]
    paths: ['verify-9fe02cf5/**', '.github/workflows/verify-9fe02cf5.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build the dashboard deterministically
        run: PYTHONDONTWRITEBYTECODE=1 python3 verify-9fe02cf5/build.py
      - name: Independent verification (citations, arithmetic, links, blanks)
        run: PYTHONDONTWRITEBYTECODE=1 python3 verify-9fe02cf5/verify.py
      - name: Check generated output is committed
        run: git diff --exit-code -- verify-9fe02cf5
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Check browser script syntax
        run: node --check verify-9fe02cf5/assets/app.js
